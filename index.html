<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FitTracker V4 Clean</title>

  <link rel="stylesheet" href="style.css" />
  <link rel="manifest" href="manifest.json" />
</head>

<body>

<!-- ================= USER OVERLAY ================= -->
<div id="userOverlay" class="overlay">
  <div class="overlay-box">
    <h2>Select User</h2>
    <div class="user-select-row">
      <button class="user-btn" data-user="Aziz">Aziz</button>
      <button class="user-btn" data-user="Yasmin">Yasmin</button>
    </div>
  </div>
</div>

<!-- ================= TOP BAR ================= -->
<header class="topbar glass">
  <div class="profile-tag" id="profileTag">User: —</div>
  <div class="top-right">
    <input id="datePicker" type="date" />
    <button id="openDrawer" class="menu-btn">☰</button>
  </div>
</header>

<!-- ================= SIDE DRAWER ================= -->
<div id="drawer" class="drawer">
  <h3>Menu</h3>
  <button class="drawer-item" id="switchUser">Switch user</button>
  <button class="drawer-item" id="exportData">Export backup</button>
  <button class="drawer-item" id="importData">Import JSON</button>
  <button class="drawer-item" id="runMigration">Migrate v3 → v4</button>
  <button class="drawer-item" id="resetData">Reset user</button>
  <button class="drawer-item close" id="closeDrawer">Close</button>
</div>

<!-- ================= CONTENT WRAPPER ================= -->
<main class="content">

  <!-- ========== FOOD PAGE ========== -->
  <section id="food" class="page active">
    <h2 class="page-title">Food</h2>
    <div id="foodContent"></div>
  </section>

  <!-- ========== EXERCISE PAGE ========== -->
  <section id="exercise" class="page">
    <h2 class="page-title">Exercise</h2>

    <div class="exercise-controls">
      <label>Difficulty:
        <select id="difficultySelect">
          <option value="beginner">Beginner</option>
          <option value="moderate">Moderate</option>
          <option value="advanced">Advanced</option>
        </select>
      </label>

      <label class="auto-prog-label">
        <input type="checkbox" id="autoProgression" />
        Auto-progression
      </label>

      <span class="prog-info">Weeks 1–3 → Beginner • Weeks 4–6 → Moderate • Weeks 7–10 → Advanced</span>
    </div>

    <div id="exerciseContent"></div>
  </section>

  <!-- ========== ANALYSIS PAGE ========== -->
  <section id="analysis" class="page">
    <h2 class="page-title">Analysis</h2>
    <div id="analysisContent"></div>
  </section>

  <!-- ========== PROFILE PAGE ========== -->
  <section id="profile" class="page">
    <h2 class="page-title">Profile</h2>
    <div id="profileContent"></div>
  </section>

</main>

<!-- ================= BOTTOM NAV ================= -->
<nav class="bottom-nav glass">
  <button class="nav-btn active" data-tab="food">🍽<span>Food</span></button>
  <button class="nav-btn" data-tab="exercise">🏋️<span>Exercise</span></button>
  <button class="nav-btn" data-tab="analysis">📊<span>Analysis</span></button>
  <button class="nav-btn" data-tab="profile">👤<span>Profile</span></button>
</nav>

<script src="app.js"></script>
</body>
</html>
