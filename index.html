<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>FitTracker v4 Pro</title>

<link rel="stylesheet" href="style.css" />
<link rel="manifest" href="manifest.json" />
</head>

<body>

<!-- ================= USER SELECT OVERLAY ================= -->
<div id="userOverlay" class="overlay glass full-center">
  <div class="overlay-box glass">
    <h2>Select User</h2>
    <div class="user-select-row">
      <button class="user-btn" data-user="Aziz">Aziz</button>
      <button class="user-btn" data-user="Yasmin">Yasmin</button>
    </div>
  </div>
</div>

<!-- ================= MAIN APP CONTAINER ================= -->
<div id="appContainer">

  <!-- ================= TOP BAR ================= -->
  <header class="topbar glass">
    <div id="profileTag" class="profile-tag">User: —</div>
    <div class="top-right">
      <input id="datePicker" type="date" class="date-input" />
      <button id="openDrawer" class="menu-btn">☰</button>
    </div>
  </header>

  <!-- ================= BOTTOM NAV ================= -->
  <nav class="bottom-nav glass">
    <button class="nav-btn active" data-tab="food">
      🍽️
      <span>Food</span>
    </button>
    <button class="nav-btn" data-tab="exercise">
      🏋️
      <span>Exercise</span>
    </button>
    <button class="nav-btn" data-tab="analysis">
      📊
      <span>Analysis</span>
    </button>
    <button class="nav-btn" data-tab="profile">
      👤
      <span>Profile</span>
    </button>
  </nav>

  <!-- ================= SIDE DRAWER ================= -->
  <div id="drawer" class="drawer glass">
    <h3>Menu</h3>

    <button class="drawer-item" id="switchUser">Switch User</button>
    <button class="drawer-item">Export Data</button>
    <button class="drawer-item">Import Data</button>
    <button class="drawer-item">Settings</button>

    <button class="drawer-item close" id="closeDrawer">Close</button>
  </div>

  <!-- ================= MAIN CONTENT AREA ================= -->
  <main class="content">

    <!-- ================= FOOD PAGE ================= -->
    <section id="food" class="page active glass">
      <h2 class="page-title">Food</h2>

      <div id="foodContent" class="page-inner">
        <!-- JS will populate daily meals here -->
      </div>
    </section>
